name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: CI=false npm run build
        working-directory: frontend
        env:
          PUBLIC_URL: /

      - run: touch build/.nojekyll
        working-directory: frontend

      - run: cp ../CNAME build/CNAME
        working-directory: frontend

      - name: Update static deployment branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git worktree add --detach deployment "$GITHUB_SHA"
          git -C deployment rm -rf .
          cp -a frontend/build/. deployment/
          git -C deployment add -A
          git -C deployment commit -m "Deploy ${GITHUB_SHA}"
          git -C deployment push --force origin HEAD:static-deployment

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
